services:
  api:
    build:
      target: builder
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - /app/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
